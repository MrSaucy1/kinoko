name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  apps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version the app is analysed and tested against; newer
      # stable releases deprecate APIs and would fail `flutter analyze`.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4

      # Sign with the repo's own keystore when the secrets are set, so new
      # APKs install as an update. Without them the build uses the debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Geen keystore-secrets gevonden; APK's worden met de debug-sleutel ondertekend."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyPassword=$KEYSTORE_KEY_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build phone APK
        run: flutter build apk --release --flavor mobile -t lib/main.dart --target-platform android-arm64

      # TV boxes and Chromecasts are often 32-bit, so the TV build carries both ABIs.
      - name: Build TV APK
        run: flutter build apk --release --flavor tv -t lib/main_tv.dart --target-platform android-arm,android-arm64

      - name: Read version from pubspec
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | tr -d ' ' | cut -d':' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Name the APKs
        run: |
          out=build/app/outputs/flutter-apk
          repo="${{ github.event.repository.name }}"
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp "$out/app-mobile-release.apk" "dist/app-release.apk"
          cp "$out/app-mobile-release.apk" "dist/$repo-v$v.apk"
          cp "$out/app-tv-release.apk" "dist/app-tv-release.apk"
          cp "$out/app-tv-release.apk" "dist/$repo-tv-v$v.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: v${{ steps.version.outputs.version }}
          body: |
            Kinoko v${{ steps.version.outputs.version }}

            - **Telefoon/tablet:** `${{ github.event.repository.name }}-v${{ steps.version.outputs.version }}.apk`
            - **Android TV:** `${{ github.event.repository.name }}-tv-v${{ steps.version.outputs.version }}.apk`
          files: app/dist/*.apk
