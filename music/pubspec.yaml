name: kinoko_music
description: "Kinoko Music — je eigen muziek, overal"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gedeeld met de Kinoko-app: API-client, thema, basiswidgets, inlogscherm
  kinoko_core:
    path: ../packages/kinoko_core

  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  web_socket_channel: ^3.0.1

  # Afspelen: just_audio speelt (ExoPlayer), audio_service houdt het op de
  # achtergrond aan de gang en verzorgt de mediamelding, het vergrendelscherm,
  # koptelefoonknoppen en Android Auto.
  just_audio: ^0.10.4
  audio_service: ^0.18.18

  # Weten of we op wifi of mobiel zitten: aparte kwaliteit per netwerk en
  # "alleen downloaden via wifi".
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
