# fail2ban-filter voor Kinoko. Kopieer naar /etc/fail2ban/filter.d/kinoko.conf
#
# Kinoko schrijft bij elke mislukte inlogpoging precies één regel:
#   kinoko: auth failure ip=203.0.113.7 reason=password
# reason is password, totp of throttled.
[Definition]
failregex = kinoko: auth failure ip=<HOST> reason=\S+\s*$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=kinoko.service
